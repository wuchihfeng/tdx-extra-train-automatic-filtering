name: Daily TRA Extra Train Auto Sync (60 Days)

on:
  schedule:
    # 台灣時間每日早上 06:00 執行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上隨時手動點擊執行

# 設定部署 GitHub Pages 所需的 Token 權限
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同一時間只有一個部署任務在執行
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Main Script (Fetch 60 Days Data)
        run: |
          python tdx_bot_and_web.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 將產生的 index.html 包裹上傳

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
