name: Daily TRA Extra Train Auto Sync (60 Days)

on:
  schedule:
    # 依序對應 UTC 時間 22:49、04:49、10:49 執行
    - cron: '49 22,4,10 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上隨時手動點擊執行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 允許 Actions 寫入 Git 倉庫以儲存上一期的 JSON 狀態檔
    permissions:
      contents: write
    
    # 🌟 關鍵在這裡：把 GitHub Secrets 綁定成環境變數傳給 Python 程式
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Main Script (Fetch 60 Days Data & Send TG)
        run: |
          python main.py

      - name: Save State to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_trains.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update last_trains.json state" && git push)
