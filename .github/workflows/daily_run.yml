name: Daily TRA Extra Train Auto Sync (45 Days)

on:
  schedule:
    # UTC 時間 22:46、10:46 執行
    # 等於台灣時間 (UTC+8) 06:46、18:46 觸發
    - cron: '46 22,10 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上隨時手動點擊執行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 允許 Actions 寫入 Git 倉庫以儲存 JSON 狀態與 HTTP 快取檔
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Main Script (Fetch 45 Days Data & Send TG)
        env:
          # 🌟 第一組金鑰 (主 Key)
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          # 🌟 第二組金鑰 (備援 Key)
          TDX_CLIENT_ID_2: ${{ secrets.TDX_CLIENT_ID_2 }}
          TDX_CLIENT_SECRET_2: ${{ secrets.TDX_CLIENT_SECRET_2 }}
          # Telegram 設定 (設定兩個 Chat ID 確保同時傳送)
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_ID_2: ${{ secrets.TG_CHAT_ID_2 }}
        run: |
          python main.py

      - name: Save State and HTTP Cache to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_trains.json http_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update state and http cache" && git push)
