name: Daily TRA Extra Train Auto Sync (60 Days)

on:
  schedule:
    # 依序對應 UTC 時間 22:49、04:49、10:49 執行
    - cron: '49 22,4,10 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上隨時手動點擊執行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5  # <--- 這裡改回 setup-python
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Main Script (Fetch 60 Days Data & Send TG)
        run: |
          python main.py
