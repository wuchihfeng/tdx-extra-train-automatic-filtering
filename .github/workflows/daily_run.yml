name: Daily TRA Extra Train Auto Sync (60 Days)

on:
  schedule:
    # 台灣時間每日早上 06:00 執行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上隨時手動點擊執行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Main Script (Fetch 60 Days Data & Send TG)
        run: |
          python main.py
